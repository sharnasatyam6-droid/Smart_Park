<!DOCTYPE html>
<html>
<head>
    <title>Register | SmartPark</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Join SmartPark today</p>

            <form method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
