<!DOCTYPE html>
<html>
<head>
    <title>Login | SmartPark</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>Login to your SmartPark account</p>

            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>
</html>
